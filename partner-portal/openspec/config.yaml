schema: spec-driven

context: |
  Язык документации проекта: русский. Пиши на русском proposal, design, specs, tasks и другие
  документы, если пользователь явно не запросил другой язык. В OpenSpec сохраняй без перевода
  обязательные структурные заголовки и ключевые слова, распознаваемые инструментами:
  Purpose, ADDED/MODIFIED/REMOVED Requirements, Requirement, Scenario, WHEN, THEN, SHALL, MUST.
  Текст требований, сценариев, решений и пояснений пиши на русском.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
