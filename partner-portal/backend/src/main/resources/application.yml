spring:
  application:
    name: partner-portal-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/partners}
    username: ${DB_USERNAME:partners}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
