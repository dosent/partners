spring:
  application:
    name: partner-portal-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/partners}
    username: ${DB_USERNAME:partners}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: PARTNER_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  paths-to-match: /api/v1/**

partners:
  auth:
    ldap:
      enabled: ${LDAP_ENABLED:false}
      url: ${LDAP_URL:}
      user-dn-pattern: ${LDAP_USER_DN_PATTERN:uid={0},ou=people,dc=example,dc=com}
      group-search-base: ${LDAP_GROUP_SEARCH_BASE:}
      group-search-filter: "${LDAP_GROUP_SEARCH_FILTER:(&(objectClass=groupOfNames)(member={0}))}"
      connect-timeout: ${LDAP_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${LDAP_READ_TIMEOUT:PT3S}
      role-groups:
        PARTNER_MANAGER: ${LDAP_GROUP_PARTNER_MANAGER:}
        RESOURCE_MANAGER: ${LDAP_GROUP_RESOURCE_MANAGER:}
        FINANCE_CONTROLLER: ${LDAP_GROUP_FINANCE_CONTROLLER:}
        SYSTEM_ADMIN: ${LDAP_GROUP_SYSTEM_ADMIN:}
    yandex:
      enabled: ${YANDEX_ID_ENABLED:false}
      client-id: ${YANDEX_CLIENT_ID:}
      client-secret: ${YANDEX_CLIENT_SECRET:}
      redirect-uri: ${YANDEX_REDIRECT_URI:http://localhost:8080/api/v1/auth/yandex/callback}
      authorization-uri: https://oauth.yandex.ru/authorize
      token-uri: https://oauth.yandex.ru/token
      user-info-uri: https://login.yandex.ru/info?format=json
      state-ttl: ${YANDEX_STATE_TTL:PT5M}
      http-timeout: ${YANDEX_HTTP_TIMEOUT:PT5S}
