spring:
  application:
    name: partner-portal-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/partners}
    username: ${DB_USERNAME:partners}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 22MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: PARTNER_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  paths-to-match: /api/v1/**

partners:
  documents:
    s3:
      endpoint: ${S3_ENDPOINT:http://object-storage:9000}
      bucket: ${S3_BUCKET:partner-leads}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      region: ${S3_REGION:us-east-1}
    clamav:
      host: ${CLAMAV_HOST:clamav}
      port: ${CLAMAV_PORT:3310}
      timeout: ${CLAMAV_TIMEOUT:PT15S}
  registration:
    encryption-key: ${REGISTRATION_ENCRYPTION_KEY:}
    hash-key: ${REGISTRATION_HASH_KEY:}
    approved-logo-asset-keys: ${PARTNER_REGISTRATION_APPROVED_LOGO_ASSET_KEYS:}
  auth:
    ldap:
      enabled: ${LDAP_ENABLED:false}
      url: ${LDAP_URL:ldaps://freeipa01.simbirsoft:636/}
      users-dn: ${LDAP_USERS_DN:cn=users,cn=accounts,dc=simbirsoft,dc=dev}
      ca-cert-file: ${LDAP_CA_CERT_FILE:/app/certs/simbirsoft-ca.crt}
      connect-timeout: ${LDAP_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${LDAP_READ_TIMEOUT:PT3S}
    yandex:
      enabled: ${YANDEX_ID_ENABLED:false}
      client-id: ${YANDEX_CLIENT_ID:}
      client-secret: ${YANDEX_CLIENT_SECRET:}
      redirect-uri: ${YANDEX_REDIRECT_URI:http://localhost:8080/api/v1/auth/yandex/callback}
      authorization-uri: https://oauth.yandex.ru/authorize
      token-uri: https://oauth.yandex.ru/token
      user-info-uri: https://login.yandex.ru/info?format=json
      state-ttl: ${YANDEX_STATE_TTL:PT5M}
      http-timeout: ${YANDEX_HTTP_TIMEOUT:PT5S}
