name: partner-portal
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORTAL_BIND_ADDRESS:-0.0.0.0}:${PORTAL_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/partners
      DB_USERNAME: partners
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      REGISTRATION_ENCRYPTION_KEY: ${REGISTRATION_ENCRYPTION_KEY:-}
      REGISTRATION_HASH_KEY: ${REGISTRATION_HASH_KEY:-}
      PARTNER_REGISTRATION_APPROVED_LOGO_ASSET_KEYS: ${PARTNER_REGISTRATION_APPROVED_LOGO_ASSET_KEYS:-}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_URL: ${LDAP_URL:-ldaps://freeipa01.simbirsoft:636/}
      LDAP_USERS_DN: ${LDAP_USERS_DN:-cn=users,cn=accounts,dc=simbirsoft,dc=dev}
      LDAP_CA_CERT_FILE: /app/certs/simbirsoft-ca.crt
      LDAP_CA_CERT_SOURCE: ${LDAP_CA_CERT_SOURCE:-./certs/simbirsoft-ca.crt}
      LDAP_CONNECT_TIMEOUT: ${LDAP_CONNECT_TIMEOUT:-PT3S}
      LDAP_READ_TIMEOUT: ${LDAP_READ_TIMEOUT:-PT3S}
      YANDEX_ID_ENABLED: ${YANDEX_ID_ENABLED:-false}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-http://localhost:8088/api/v1/auth/yandex/callback}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      S3_ENDPOINT: http://object-storage:9000
      S3_BUCKET: ${S3_BUCKET:-partner-leads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Copy .env.example to .env and set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Copy .env.example to .env and set S3_SECRET_KEY}
      CLAMAV_HOST: clamav
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      clamav:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - "${LDAP_CA_CERT_SOURCE:-./certs/simbirsoft-ca.crt}:/app/certs/simbirsoft-ca.crt:ro"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    environment:
      SERVER_PORT: 8081
      BACKEND_API_URL: http://backend:8080
      BACKEND_OPENAPI_URL: http://backend:8080/v3/api-docs
      MCP_BACKEND_TIMEOUT: ${MCP_BACKEND_TIMEOUT:-PT10S}
      MCP_MAX_REQUEST_BYTES: ${MCP_MAX_REQUEST_BYTES:-31457280}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_PORT:-8081}:8081"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partners
      POSTGRES_USER: partners
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partners -d partners"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Copy .env.example to .env and set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Copy .env.example to .env and set S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${S3_API_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4.3
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres-data:
  object-storage-data:
