name: partner-portal-e2e
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${E2E_PORT:-18088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.e2e
    environment:
      S3_ENDPOINT: http://object-storage:9000
      S3_BUCKET: e2e-attachments
      S3_ACCESS_KEY: e2e-storage-user
      S3_SECRET_KEY: e2e-storage-password
      SPRING_PROFILES_ACTIVE: e2e
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/partners_e2e
      DB_USERNAME: partners_e2e
      DB_PASSWORD: e2e-database-password
      REGISTRATION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      REGISTRATION_HASH_KEY: dGVzdC1oYXNoLWtleS10aGF0LWlzLWxvbmctZW5vdWdo
      LDAP_ENABLED: "false"
      YANDEX_ID_ENABLED: "true"
      YANDEX_CLIENT_ID: e2e-client-id
      YANDEX_CLIENT_SECRET: e2e-client-secret
      YANDEX_REDIRECT_URI: ${E2E_BASE_URL:-http://localhost:18088}/api/v1/auth/yandex/callback
      PARTNER_REGISTRATION_APPROVED_LOGO_ASSET_KEYS: simbirsoft,17soft
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    restart: "no"

  mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile.e2e
    environment:
      SERVER_PORT: 8081
      BACKEND_API_URL: http://backend:8080
      BACKEND_OPENAPI_URL: http://backend:8080/v3/api-docs
      MCP_BACKEND_TIMEOUT: PT10S
      MCP_MAX_REQUEST_BYTES: "31457280"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${E2E_MCP_PORT:-18089}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    restart: "no"

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: e2e-storage-user
      MINIO_ROOT_PASSWORD: e2e-storage-password
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partners_e2e
      POSTGRES_USER: partners_e2e
      POSTGRES_PASSWORD: e2e-database-password
    volumes:
      - e2e-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partners_e2e -d partners_e2e"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"

volumes:
  e2e-postgres-data:
